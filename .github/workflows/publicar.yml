name: Publicador Automatico Pinterest

on:
  schedule:
    - cron: '0 9,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar_feed:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install google-genai

      - name: Generar Feed XML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python bot.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update feed.xml" && git push)
